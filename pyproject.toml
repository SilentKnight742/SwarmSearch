[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "swarmsearch"
version = "0.1.0"
description = "Fault-tolerant cooperative multi-UAV search and recovery using ArduPilot SITL and MAVLink."
requires-python = ">=3.11"

dependencies = [
    "pymavlink",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "websockets==17.1",
]


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]